version: '1'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    hostname: nginx
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./test/public:/var/www/public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=Host(`symfony.local`)"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
    depends_on:
      - php
    networks:
      - test_local_env
    restart: always
    
  php:
    image: php:8.2-fpm
    container_name: php
    volumes:
      - ./test:/var/www
    expose:
      - "9000"
    networks:
      - test_local_env
    restart: always

  postgres:
    container_name: postgres
    image: postgres:13
    hostname: postgres
    init: true
    ports:
    - 5432:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - psql_data:/var/lib/postgresql/data
      - psql_db:/var/db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postgres.rule=Host(`psql.local`)"
    working_dir: /var/db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test_local_env
    restart: always

  portainer:
    image: portainer/portainer-ce:2.20.1-alpine
    hostname: portainer
    ports:
      - 9000:9000
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.local`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    networks:
      - test_local_env
    restart: always

  redis:
    container_name: redis
    image: "redis:7.4.0-alpine"
    hostname: redis
    ports:
    - 6378:6378
    volumes:
      - redis_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis.rule=Host(`redis.local`)"
    networks:
      - test_local_env
    restart: always

  traefik:
    image: traefik:v3.0
    hostname: traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.local`)"
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/config.yml:/etc/traefik/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    networks:
      - test_local_env
    restart: always
    
  symfony:
    build: ./test
    container_name: symfony
    volumes:
      - ./test:/var/www
      - ./.env:/var/www/app/.env
    expose:
      - "9000"
    networks:
      - test_local_env
    depends_on:
      - postgres
    restart: always

networks:
  test_local_env:
    name: test_local_env
    driver: bridge

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "./data/portainer/data"
  psql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "./data/psql/data"
  psql_db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "./data/psql/db"
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "./data/redis/data"

